name: Fynote Windows release

on:
  push:
    branches: ['**']
    paths:
      - package.json
      - .github/workflows/windows-release.yml
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fynote-windows-release
  cancel-in-progress: false

jobs:
  package:
    if: github.repository == 'heytoby/fynote' && (github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/tags/v'))
    runs-on: windows-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test server/desktop-updater.test.js
      - run: npm run build
      - id: package
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:GITHUB_REF -like 'refs/tags/*' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw 'The release tag does not match package.json.'
          }
          ./scripts/package-windows.ps1 -OutputDirectory "$env:RUNNER_TEMP/fynote-release"
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: fynote-windows
          path: ${{ runner.temp }}/fynote-release/*.zip
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fynote-windows
          path: release
      - name: Publish Windows package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            exit 0
          fi
          gh release create "$tag" "release/fynote-$RELEASE_VERSION-windows-x64.zip" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Fynote $RELEASE_VERSION" --generate-notes --latest
